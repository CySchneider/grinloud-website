<!DOCTYPE html>

<head>

<body>
  <div id="root"></div>

  <!-- Vanilla web component for image slots -->

  <script type="text/babel" src="src/HomeA.jsx"></script>

  <script type="text/babel" src="src/App.jsx"></script>
