<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRINLOUD — House Music Curated Daily</title>

  <!-- The app syncs the address bar to /pick/.../ or /radar/.../ as the user
       navigates (see App.jsx), without a real page reload. Assets are
       referenced with relative, no-leading-slash paths that assume they run
       at "/", so <base> keeps those resolving to site root regardless of
       whatever path is currently shown in the address bar. -->
  <base href="/">

  <!-- Canonical -->
  <link rel="canonical" href="https://grinloud.com/" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="grinloud-smiley-2026.png" />
  <link rel="apple-touch-icon" href="grinloud-smiley-2026.png" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://grinloud.com/" />
  <meta property="og:locale"      content="en_US" />
  <meta property="og:title"       content="GRINLOUD — House Music Curated Daily" />
  <meta property="og:description" content="Pick of the Day. Music Radar every 10 days. House · Tech House · Progressive · Bass House." />
  <meta property="og:image"       content="https://grinloud.com/OG-Graph.jpg" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter / X -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="GRINLOUD — House Music Curated Daily" />
  <meta name="twitter:description" content="Pick of the Day. Music Radar every 10 days." />
  <meta name="twitter:image"       content="https://grinloud.com/OG-Graph.jpg" />

  <!-- General -->
  <meta name="description" content="Pick of the Day. Music Radar every 10 days. House · Tech House · Progressive · Bass House." />
  <meta name="theme-color" content="#FAF7F2" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "GRINLOUD",
    "url": "https://grinloud.com",
    "description": "House music curated daily. Pick of the Day. Music Radar every 10 days."
  }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "GRINLOUD",
    "url": "https://grinloud.com",
    "logo": "https://grinloud.com/Logo%20GRINLOUD%20Smiley%20Yellow%20black.png",
    "description": "House music curated daily. Pick of the Day. Music Radar every 10 days. House · Tech House · Progressive · Bass House.",
    "sameAs": [
      "https://instagram.com/grinloud",
      "https://youtube.com/@grinloud"
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=UnifrakturMaguntia&family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">


</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
