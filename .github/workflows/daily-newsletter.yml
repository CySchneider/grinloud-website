name: Daily Pick of the Day Newsletter

on:
  schedule:
    # 08:00 UTC = 09:00 CET (10:00 CEST in summer — adjust if needed)
    - cron: '0 8 * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send Pick of the Day newsletter
        env:
          BEEHIIV_API_KEY:        ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
          RESEND_API_KEY:         ${{ secrets.RESEND_API_KEY }}
        run: node scripts/send-daily-pick.js
