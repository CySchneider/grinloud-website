name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    # 00:15 UTC — always after midnight in Europe/Zurich (CET/CEST), so the
    # static /pick/ and /radar/ pages, homepage fallback, and sitemap that
    # scripts/generate-static-pages.js bakes at build time pick up whatever
    # went live at midnight even on days nobody pushes a commit. Runs well
    # before the 06:00 UTC newsletter cron (daily-newsletter.yml).
    - cron: '15 0 * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=grinloud-website --branch=main --commit-dirty=true
