<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRINLOUD Email Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 40px 20px; background: #888; font-family: sans-serif; }
  .preview-label { text-align: center; font-size: 12px; color: #fff; opacity: 0.6; margin-bottom: 16px; letter-spacing: 0.1em; text-transform: uppercase; }
  .swatches { display: flex; gap: 12px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap; }
  .swatches button { padding: 6px 14px; border: 2px solid #fff; background: transparent; color: #fff; cursor: pointer; font-size: 11px; letter-spacing: 0.1em; border-radius: 4px; }
  .swatches button:hover { background: rgba(255,255,255,0.2); }
  iframe { display: block; margin: 0 auto; border: none; width: 640px; max-width: 100%; }
</style>
</head>
<body>
<p class="preview-label">GRINLOUD — Email Preview</p>
<div class="swatches">
  <button onclick="setAccent('pink','#FF1F8F')">Pink</button>
  <button onclick="setAccent('yellow','#FFE000')">Yellow</button>
  <button onclick="setAccent('blue','#00C2FF')">Blue</button>
  <button onclick="setAccent('green','#39FF14')">Green</button>
  <button onclick="setAccent('orange','#FF6200')">Orange</button>
</div>
<div id="email-wrap"></div>

<script>
const picks = {
  pink:   { title: 'Bad Wolf',  artist: 'MICHAEL BIBI',  bpm: 131, key: 'Ab Major', label: 'EMPIRE',  genre: 'Tech House', date: '2026-06-09', info: "Bibi on EMPIRE. Bad Wolf has teeth — dark, muscular, completely in control. One of his sharpest.", spotify: 'https://open.spotify.com/track/4S8bYzrUHwoAsPzJWRt4QM' },
  yellow: { title: 'Alcoholic', artist: 'SAN PACHO',     bpm: 132, key: 'Eb Major', label: 'LIBERA',  genre: 'Tech House', date: '2026-06-10', info: "San Pacho on LIBERA closes 005 in style. Alcoholic is the kind of track that keeps going long after the night ends.", spotify: 'https://open.spotify.com/track/5Iedc3D20KJoj95uQRp5p0' },
  blue:   { title: 'Lipstick',  artist: 'ALAIA & GALLO', bpm: 128, key: 'D Minor',  label: 'Toolroom', genre: 'Tech House', date: '2026-06-03', info: "Toolroom's finest doing what they do best. Lipstick is proper floor-first Tech House — tight, punchy, and impossible to shake.", spotify: '#' },
  green:  { title: 'Control',   artist: 'FISHER',        bpm: 130, key: 'F Minor',  label: 'Catch & Release', genre: 'Tech House', date: '2026-06-08', info: "Fisher keeps the pressure on. Control is stripped back and relentless — the kind of weapon that works at 2am when nothing else will.", spotify: '#' },
  orange: { title: 'Pulse',     artist: 'CHRIS LAKE',    bpm: 127, key: 'A Minor',  label: 'Black Book', genre: 'House', date: '2026-06-07', info: "Chris Lake distilling house music to its core. Pulse runs clean and deep, built for rooms with serious speakers.", spotify: '#' },
};

function buildEmail(accentKey, accent) {
  const p = picks[accentKey];
  const ink = '#0A0A0A';
  const inkDim = 'rgba(10,10,10,0.45)';
  const paper = '#F5F2EE';
  const [yyyy, mm, dd] = p.date.split('-');
  const dateFmt = `${dd} · ${mm} · ${yyyy}`;
  const btnStyle = `display:inline-block;background:#0A0A0A;color:#F5F2EE;font-family:'JetBrains Mono','IBM Plex Mono','Courier New',monospace;font-size:11px;font-weight:700;letter-spacing:0.14em;padding:10px 20px;border-radius:999px;text-decoration:none;margin:0 6px 6px 0;text-transform:uppercase;`;
  const spotifyBtn = p.spotify && p.spotify !== '#' ? `<a href="${p.spotify}" style="${btnStyle}">&#9654; Spotify</a>` : '';

  return `<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:${accent};">
<table width="100%" height="100%" cellpadding="0" cellspacing="0" border="0" style="background:${accent};min-height:100vh;">
<tr><td align="center" valign="top" style="padding:40px 0;">
  <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;">

    <!-- NAV -->
    <tr><td style="padding:20px 32px 18px;border-bottom:2px solid ${ink};">
      <table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
        <td>
          <img src="/Logo%20GRINLOUD%20Smiley%20Yellow%20black.png" width="36" height="36" alt="GRINLOUD" style="display:inline-block;vertical-align:middle;margin-right:10px;border-radius:50%;border:4px solid ${ink};box-shadow:4px 4px 0 ${ink};background:#FFE000;">
          <span style="font-family:'Archivo Black','Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:900;letter-spacing:0;color:${ink};vertical-align:middle;text-transform:uppercase;">GRINLOUD</span>
        </td>
        <td align="right">
          <span style="font-family:'JetBrains Mono','IBM Plex Mono','Courier New',monospace;font-size:9px;font-weight:700;letter-spacing:0.18em;color:${inkDim};text-transform:uppercase;">Pick of the Day</span>
        </td>
      </tr></table>
    </td></tr>

    <!-- HERO -->
    <tr><td style="padding:40px 32px 0;">
      <p style="margin:0 0 20px;font-family:'JetBrains Mono','IBM Plex Mono','Courier New',monospace;font-size:10px;font-weight:700;letter-spacing:0.16em;color:${inkDim};text-transform:uppercase;">
        ${dateFmt} &nbsp;·&nbsp; ${p.genre.toUpperCase()}
      </p>
      <h1 style="margin:0 0 14px;font-family:'Archivo Black','Helvetica Neue',Arial,sans-serif;font-size:52px;font-weight:900;line-height:0.9;letter-spacing:-0.03em;color:${ink};text-transform:uppercase;">
        ${p.title}
      </h1>
      <p style="margin:0 0 28px;font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;font-size:20px;font-weight:700;letter-spacing:-0.01em;color:${ink};">
        ${p.artist}
      </p>
      <div style="height:2px;background:${ink};opacity:0.15;margin-bottom:28px;"></div>
      <p style="margin:0 0 32px;font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.55;color:${ink};opacity:0.8;max-width:480px;">
        ${p.info}
      </p>
      <table cellpadding="0" cellspacing="0" border="0" style="margin-bottom:32px;">
        <tr>
          ${[['BPM', p.bpm], ['KEY', p.key], ['LABEL', p.label]].map(([l, v]) => `
          <td style="padding-right:6px;vertical-align:middle;">
            <span style="display:inline-block;padding:6px 10px;border:2px solid ${ink};border-radius:4px;font-family:'JetBrains Mono','IBM Plex Mono','Courier New',monospace;font-size:10px;letter-spacing:0.12em;color:${ink};white-space:nowrap;">
              <span style="opacity:0.5;">${l}&ensp;</span><span style="font-weight:600;">${v || '—'}</span>
            </span>
          </td>`).join('')}
        </tr>
      </table>
      <div style="margin-bottom:48px;">
        <a href="https://grinloud.com" style="display:inline-block;background:${ink};color:#F5F2EE;font-family:'JetBrains Mono','IBM Plex Mono','Courier New',monospace;font-size:10px;font-weight:700;letter-spacing:0.14em;padding:7px 14px;border-radius:999px;text-decoration:none;text-transform:uppercase;">GRINLOUD.COM &#8599;</a>
      </div>
    </td></tr>

    <!-- FOOTER -->
    <tr><td style="padding:20px 32px 24px;">
      <p style="margin:0 0 4px;font-family:'JetBrains Mono','IBM Plex Mono','Courier New',monospace;font-size:9px;font-weight:700;letter-spacing:0.16em;color:${inkDim};text-transform:uppercase;">
        House Music Curated Daily &nbsp;·&nbsp; Mixed All 10 Days
      </p>
      <p style="margin:0;font-family:'Space Grotesk','Helvetica Neue',Arial,sans-serif;font-size:11px;color:${inkDim};">
        <a href="https://grinloud.com" style="color:${inkDim};text-decoration:none;">grinloud.com</a>
        &nbsp;·&nbsp;
        <a href="#" style="color:${inkDim};text-decoration:none;">Unsubscribe</a>
      </p>
    </td></tr>

  </table>
</td></tr>
</table>
</body>
</html>`;
}

function setAccent(key, hex) {
  const wrap = document.getElementById('email-wrap');
  wrap.innerHTML = '';
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'display:block;margin:0 auto;border:none;width:640px;max-width:100%;height:700px;';
  wrap.appendChild(iframe);
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(buildEmail(key, hex));
  doc.close();
  // Adjust height after load
  iframe.onload = () => {
    iframe.style.height = (iframe.contentDocument.body.scrollHeight + 40) + 'px';
  };
}

setAccent('blue', '#00C2FF');
</script>
</body>
</html>
